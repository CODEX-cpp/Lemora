<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Pagina autosufficiente: viene mostrata a qualsiasi profondita' di URL, su Laragon (radice /) e su GitHub Pages (/Lemora/),
     quindi niente file esterni da cercare con percorsi relativi. Lo stile e' inline e nessuno script e' permesso. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="robots" content="noindex">
<title>Pagina non trovata · Page not found · Lemora</title>
<style>
:root { color-scheme: light dark; --bg: #f5f4f0; --text: #1c1d1b; --dim: #5b5d58; --rule: #d9d7d0; --accent: #2f6f4f; }
@media (prefers-color-scheme: dark) { :root { --bg: #121312; --text: #e9e8e3; --dim: #a3a59f; --rule: #2c2e2b; --accent: #7fbf9a; } }
body { margin: 0; background: var(--bg); color: var(--text); font: 1rem/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 40rem; margin: 0 auto; padding: 4rem 1rem; display: grid; gap: 2.5rem; }
section { border-top: 2px solid var(--text); padding-top: 1rem; display: grid; gap: 0.75rem; }
h1, h2 { margin: 0; font-size: 1.75rem; line-height: 1.2; }
p { margin: 0; color: var(--dim); }
.cod { font-family: ui-monospace, Consolas, monospace; font-size: 0.8rem; color: var(--accent); }
a { color: var(--accent); font-weight: 600; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <p class="cod">404 · Lemora</p>
  <section>
    <h1>Pagina non trovata</h1>
    <p>L'indirizzo non esiste o la pagina è stata spostata.</p>
    <p><a href="/it/">Vai alla pagina iniziale in italiano</a></p>
  </section>
  <section lang="en">
    <h2>Page not found</h2>
    <p>The address does not exist or the page has moved.</p>
    <p><a href="/en/" hreflang="en">Go to the English home page</a></p>
  </section>
</main>
</body>
</html>
